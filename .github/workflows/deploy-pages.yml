name: Deploy Learning Archive to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Repair generated App source for deployment
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          s = s.replace("  certificateUrl: string;\n}\n}\n\nconst COURSES", "  certificateUrl: string;\n}\n\nconst COURSES", 1)
          marker = "    code: 'GAI-2026-07-MCTZ',\n    \n    rotation: '-rotate-1',"
          replacement = "    code: 'GAI-2026-07-MCTZ',\n    certificateUrl: '/certificados/07-ai-app-building.pdf',\n    rotation: '-rotate-1',"
          s = s.replace(marker, replacement, 1)
          p.write_text(s)
          PY

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
